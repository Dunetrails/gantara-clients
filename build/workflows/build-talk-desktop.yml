name: "Build: Gantara Talk desktop client"

# Produces Gantara-branded Talk desktop packages for trademark compliance with
# the Community edition we host (see clients/talk-desktop/README.md). We do NOT
# keep a divergent fork: each job checks out a PINNED upstream tag and stages a
# branding overlay (talk-desktop's own .overrides/build.config.json + Gantara
# icons), then runs upstream's own release:package flow.
#
# Outputs:
#   - Linux: single-file AppImage (electron-forge zip tree wrapped via appimagetool,
#     with self-integrating AppRun for the applications menu).
#   - Both: Gantara_Talk-<version>-source.tar.gz (clients/make-source-tarball.sh), the
#     corresponding source of the packages including the bundled Talk web app,
#     attached by the source job.
#   - Windows: Squirrel setup .exe (Start Menu / Programs via the installer), plus
#     Gantara_Talk-<version>-signing.json saying whether it is Authenticode-signed.
#     Signed with Azure Artifact Signing once the repo variables in SIGNING.md are set,
#     unsigned until then: WINDOWS_SIGN_PARAMS is then empty and forge skips signing.
#     Auto-update is off: branded builds do not poll GitHub, and the Squirrel
#     RELEASES/nupkg update feed is not published.
#
# The build config sets primaryColor/backgroundColor to the Gantara colour, which
# themes the in-app Talk web UI. To keep builds fast, pre-extracted themed styles are
# committed under clients/talk-desktop/branding/styles/ and staged by apply-branding.sh, so
# release:package reuses them and skips the Docker-based extraction. If they are absent or
# stale for the bundled Nextcloud major, the Linux job extracts them itself (Docker, adds
# several minutes) and the Windows job stops — run the "Build: Talk desktop theme styles (refresh)" workflow
# (refresh-talk-styles.yml) first.
# macOS (and its notarization) stays disabled in the build config.
#
# Manual trigger only. Pick Linux or Windows per run (not both). The package
# is attached to a GitHub Release (browser download; not Actions artifact
# quota). With release=false it is kept as a one-day workflow artifact
# instead, and no release changes.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which package to build. One platform per run."
        required: true
        type: choice
        options:
          - linux
          - windows
        default: linux
      talk_desktop_ref:
        description: "nextcloud/talk-desktop git tag to build from."
        required: true
        default: "v2.3.4"
      channel:
        description: "Release channel compiled into the app: stable, beta or dev. (Since v2.3 the bundled Talk is fixed by the tag.)"
        required: true
        default: "stable"
      release:
        description: "Attach the package to the GitHub release. Off: a one-day workflow artifact only (test builds)."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux:
    name: Rebrand + build Talk desktop (Linux AppImage)
    if: github.event.inputs.platform == 'linux'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the GitHub release
    steps:
      - name: Checkout talk-desktop at pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/talk-desktop
          ref: ${{ github.event.inputs.talk_desktop_ref }}
          path: talk-desktop

      - name: Checkout platform repo (branding overlay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: platform

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The tray helper talks raw D-Bus, so nothing in the app build exercises it:
      # a broken pixmap or dbusmenu layout costs the icon or the right-click menu
      # and only shows up on a user's desktop. Run its self-tests against a real
      # session bus instead.
      - name: Validate Linux tray helper (sni_tray.py)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi dbus-x11
          python3 platform/clients/talk-desktop/branding/validate-sni-tray.py

      # generate-icons (run below) needs the dev deps (icon-gen). release:package
      # re-runs `npm ci` internally, which is harmless and does not touch img/.
      - name: Install talk-desktop dependencies
        working-directory: talk-desktop
        run: npm ci

      - name: Apply Gantara branding
        run: bash platform/clients/talk-desktop/branding/apply-branding.sh "${GITHUB_WORKSPACE}/talk-desktop"

      - name: Verify branding
        run: bash platform/clients/talk-desktop/branding/verify-branding.sh "${GITHUB_WORKSPACE}/talk-desktop"

      - name: Generate branded icons
        working-directory: talk-desktop
        run: npm run generate-icons

      # Upstream orchestrator: clones the bundled Talk (spreed) version, installs
      # both trees, runs the (no-op here) styles override, then builds + packages.
      # --skip-check tolerates our uncommitted branding edits in the working tree.
      - name: Build + package (Linux)
        working-directory: talk-desktop
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
        run: npm run release:package -- --linux --skip-check

      # electron-forge has no AppImage maker; wrap the packaged app tree it left
      # under out/ into a single-file AppImage.
      - name: Wrap into AppImage
        run: bash platform/clients/talk-desktop/branding/make-appimage.sh "${GITHUB_WORKSPACE}/talk-desktop"

      # Inject the self-integrating AppRun so the AppImage registers itself in the
      # applications menu on first launch (no separate install step needed).
      - name: Embed desktop integration
        run: |
          set -euo pipefail
          for f in "${GITHUB_WORKSPACE}"/talk-desktop/out/appimage/*.AppImage; do
            bash platform/clients/embed-desktop-integration.sh "${f}"
          done

      - name: Attach AppImage to GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: talk-desktop-${{ github.event.inputs.talk_desktop_ref }}
          name: Gantara Talk desktop ${{ github.event.inputs.talk_desktop_ref }}
          body: |
            Rebranded Nextcloud Talk desktop client. Download the asset and distribute that file.
            Windows builds do not auto-update; `Gantara_Talk-*-signing.json` says whether the
            setup is Authenticode-signed (see SIGNING.md).
          files: talk-desktop/out/appimage/*.AppImage
          fail_on_unmatched_files: true
          make_latest: false

      - name: Keep the AppImage as a workflow artifact (test build)
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talk-linux
          path: talk-desktop/out/appimage/*.AppImage
          retention-days: 1

  windows:
    name: Rebrand + build Talk desktop (Windows EXE)
    if: github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    permissions:
      contents: write # publishes the GitHub release
      id-token: write # azure/login with OIDC, only when signing is configured
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - name: Checkout talk-desktop at pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/talk-desktop
          ref: ${{ github.event.inputs.talk_desktop_ref }}
          path: talk-desktop

      - name: Checkout platform repo (branding overlay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: platform

      - name: Check the signing configuration
        id: signing
        shell: bash
        run: bash platform/.github/scripts/windows-signing-gate.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install talk-desktop dependencies
        working-directory: talk-desktop
        run: npm ci

      # Git Bash is on windows-latest; apply-branding.sh is POSIX bash.
      - name: Apply Gantara branding
        shell: bash
        run: bash platform/clients/talk-desktop/branding/apply-branding.sh "${GITHUB_WORKSPACE}/talk-desktop"

      - name: Verify branding
        shell: bash
        run: bash platform/clients/talk-desktop/branding/verify-branding.sh "${GITHUB_WORKSPACE}/talk-desktop"

      # Without committed, current styles release:package would try the Docker extraction,
      # which needs Linux containers this runner does not have — fail with the actual fix.
      - name: Check committed theme styles
        working-directory: talk-desktop
        shell: bash
        run: |
          node -e "
            const { getNextcloudStyles, getNextcloudVersionForTalk } = require('./build/resolveBuildConfig.js')
            if (!getNextcloudStyles().overridesUpToDate) {
              console.error('::error::No up-to-date theme styles for Nextcloud ' + getNextcloudVersionForTalk() + ' in clients/talk-desktop/branding/styles. Run the refresh-talk-styles workflow for this talk_desktop_ref first.')
              process.exit(1)
            }
          "

      - name: Generate branded icons
        working-directory: talk-desktop
        run: npm run generate-icons

      # Upstream's forge config hands WINDOWS_SIGN_PARAMS to @electron/windows-sign, which
      # signs the .exe/.dll/.node files of the packaged app (signtool from
      # WINDOWS_SIGNTOOL_PATH), and to Squirrel, which signs Update.exe, the exes in the
      # nupkg and Setup.exe with the signtool.exe in electron-winstaller's vendor folder.
      # That one dates from 2014 and cannot load the Artifact Signing dlib, so it is
      # replaced with the SDK's; --skip-install keeps release:package's own npm ci from
      # restoring it (our npm ci above already ran).
      - name: Set up Artifact Signing for forge and Squirrel
        id: sign-params
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE\platform\clients\windows-signing.ps1" install
          $vendored = @(Get-ChildItem -Path talk-desktop\node_modules -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '[\\/]electron-winstaller[\\/]vendor[\\/]signtool\.exe$' })
          if ($vendored.Count -eq 0) { throw "electron-winstaller's vendor\signtool.exe not found" }
          foreach ($f in $vendored) { Copy-Item -Force $env:SIGNTOOL_EXE $f.FullName; Write-Host "replaced $($f.FullName)" }
          "WINDOWS_SIGNTOOL_PATH=$env:SIGNTOOL_EXE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "params=$env:ARTIFACT_SIGNING_PARAMS" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Log in to Azure (OIDC, no secret)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Unsigned while signing is not configured: WINDOWS_SIGN_PARAMS is then empty, so
      # forge skips Authenticode. Do not attach Squirrel's RELEASES/nupkg — those are an
      # update feed, and this client does not auto-update.
      - name: Build + package (Windows Squirrel EXE)
        working-directory: talk-desktop
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          WINDOWS_SIGN_PARAMS: ${{ steps.sign-params.outputs.params }}
        run: npm run release:package -- --windows --skip-check --skip-install

      - name: Collect setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exes = @(Get-ChildItem -Path "talk-desktop\out\make\squirrel.windows" -Recurse -Filter *.exe -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) { throw "Squirrel produced no .exe under talk-desktop/out/make/squirrel.windows" }
          $licenses = @(Get-ChildItem -Path "talk-desktop\out" -Directory -Filter "*-win32-*" -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "resources\licenses\LICENSE") })
          if ($licenses.Count -eq 0) { throw "resources\licenses missing from the packaged app (forge extraResource patch not applied?)" }
          $nextcloud = @($exes | Where-Object { $_.Name -match '(?i)nextcloud' })
          if ($nextcloud.Count -gt 0) {
            throw "Nextcloud-named installer survived branding: $($nextcloud.Name -join ', ')"
          }
          if ($exes.Count -ne 1) { throw "Expected one setup .exe, found: $($exes.Name -join ', ')" }
          # Squirrel names the setup after the kept package id (Dunetrails.Talk); the install
          # identity lives inside the nupkg, so the download can carry the display name.
          New-Item -ItemType Directory -Force -Path talk-desktop-windows-out | Out-Null
          $dest = Join-Path "talk-desktop-windows-out" "Gantara_Talk-windows-x64.exe"
          Copy-Item -Force $exes[0].FullName $dest
          Write-Host "artifact: $($exes[0].FullName) -> $dest"

      # The nupkg is what Setup.exe installs, Update.exe included.
      - name: Verify the signatures (setup and every binary it installs)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nupkg = @(Get-ChildItem -Path "talk-desktop\out\make\squirrel.windows" -Recurse -Filter *-full.nupkg)
          if ($nupkg.Count -ne 1) { throw "Expected one full nupkg, found: $($nupkg.Name -join ', ')" }
          $payload = Join-Path $env:RUNNER_TEMP "talk-payload"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($nupkg[0].FullName, $payload)
          & "$env:GITHUB_WORKSPACE\platform\clients\windows-signing.ps1" verify talk-desktop-windows-out\Gantara_Talk-windows-x64.exe $payload

      # Read by the gantara.eu download page and the release notes to decide whether to
      # show the SmartScreen hint; mirrored and checksummed with the installers.
      - name: Record the signing state
        shell: bash
        env:
          TALK_REF: ${{ github.event.inputs.talk_desktop_ref }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          printf '{"windows":{"authenticode":%s}}\n' "${SIGNED}" >"talk-desktop-windows-out/Gantara_Talk-${TALK_REF#v}-signing.json"
          cat "talk-desktop-windows-out/Gantara_Talk-${TALK_REF#v}-signing.json"

      - name: Attach setup EXE to GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: talk-desktop-${{ github.event.inputs.talk_desktop_ref }}
          name: Gantara Talk desktop ${{ github.event.inputs.talk_desktop_ref }}
          body: |
            Rebranded Nextcloud Talk desktop client. Download the asset and distribute that file.
            Windows builds do not auto-update; `Gantara_Talk-*-signing.json` says whether the
            setup is Authenticode-signed (see SIGNING.md).
          files: talk-desktop-windows-out/*
          fail_on_unmatched_files: true
          make_latest: false

      - name: Keep the setup EXE as a workflow artifact (test build)
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talk-windows
          path: talk-desktop-windows-out/*
          retention-days: 1

  # Runs after whichever platform was built, so the release it attaches to exists.
  # The tarball only depends on the commits, so a Linux and a Windows run from the
  # same commit upload identical bytes.
  source:
    name: Attach the source tarball
    needs: [linux, windows]
    if: always() && inputs.release && (needs.linux.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads to the release
    steps:
      - name: Checkout talk-desktop at pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/talk-desktop
          ref: ${{ github.event.inputs.talk_desktop_ref }}
          path: talk-desktop

      - name: Checkout platform repo (branding overlay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: platform

      - name: Warn when upstream has a newer stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TALK_REF: ${{ github.event.inputs.talk_desktop_ref }}
        run: |
          set -euo pipefail
          newest="$(gh api 'repos/nextcloud/talk-desktop/releases?per_page=30' \
            -q '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sort -V | tail -n1)"
          if [ "$(printf '%s\n%s\n' "${newest}" "${TALK_REF}" | sort -V | tail -n1)" != "${TALK_REF}" ]; then
            echo "::warning::Built ${TALK_REF}, but nextcloud/talk-desktop has a newer stable release: ${newest}"
          else
            echo "${TALK_REF} is the newest stable nextcloud/talk-desktop release"
          fi

      - name: Build the source tarball
        id: tarball
        env:
          TALK_REF: ${{ github.event.inputs.talk_desktop_ref }}
        run: bash platform/clients/make-source-tarball.sh talk-desktop talk-desktop "${TALK_REF}" platform out

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: talk-desktop-${{ github.event.inputs.talk_desktop_ref }}
          FILE: ${{ steps.tarball.outputs.file }}
        run: gh release upload "${TAG}" "${FILE}" --clobber -R "${GITHUB_REPOSITORY}"
