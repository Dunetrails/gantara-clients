name: "Build: Gantara desktop sync client"

# Builds the Nextcloud desktop sync client as Gantara, for trademark
# compliance with the Community edition we host. See clients/desktop/README.md.
#
# There is no fork: the job checks out a pinned upstream tag and
# clients/desktop/branding/apply-branding.sh rewrites the marks in place, so
# following a new upstream release is a desktop_ref bump, plus builder_image
# for Linux. Windows reads its Craft blueprint branches from the tag's own
# craftmaster.ini.
#
# Outputs:
#   - Linux: AppImage via upstream admin/linux/build-appimage.sh
#   - Windows: NSIS installer via KDE Craft (same toolchain as upstream
#     windows-build-and-test.yml), plus Gantara_Desktop-<version>-signing.json
#     saying whether it is Authenticode-signed. Signed with Azure Artifact
#     Signing once the repo variables in SIGNING.md are set, unsigned until then.
#   - Both: Gantara_Desktop-<version>-source.tar.gz (clients/make-source-tarball.sh),
#     the corresponding source of the packages, attached by the source job.
#
# Manual trigger. Pick Linux or Windows per run. The package is attached to a
# GitHub Release, which is a browser download and does not consume Actions
# artifact storage. With release=false it is kept as a one-day workflow
# artifact instead, and no release changes.
#
# Deliberately out of scope: macOS packages and an update server — the client
# is built with the updater compiled out.
#
# This workflow does not touch the Talk client; that is build-talk-desktop.yml.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which package to build. One platform per run."
        required: true
        type: choice
        options:
          - linux
          - windows
        default: windows
      desktop_ref:
        description: "nextcloud/desktop tag to build. apply-branding.sh is written against v35.0.x — see clients/desktop/README.md."
        required: true
        default: "v35.0.3"
      builder_image:
        description: "Nextcloud's own AppImage build container, as pinned by the tag's .github/workflows/linux-appimage.yml. Used when platform=linux."
        required: true
        default: "ghcr.io/nextcloud/continuous-integration-client-appimage-qt6:client-appimage-el9-6.11.2-5"
      craft_blueprint_branch:
        description: "Optional override for both Craft blueprint branches. Empty uses the tag's craftmaster.ini. Used when platform=windows."
        required: false
        default: ""
      release:
        description: "Attach the package to the GitHub release. Off: a one-day workflow artifact only (test builds)."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  appimage:
    name: Rebrand and build AppImage (x86_64)
    if: github.event.inputs.platform == 'linux'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the GitHub release
    container: ${{ github.event.inputs.builder_image }}
    timeout-minutes: 180
    steps:
      - name: Check out this repo (branding overlay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: platform

      - name: Check out nextcloud/desktop at the pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/desktop
          ref: ${{ github.event.inputs.desktop_ref }}
          submodules: recursive
          path: desktop

      # The container runs as root while the checkouts are owned by another uid,
      # so git refuses to touch them until they are marked safe.
      - name: Trust the workspace directories
        run: git config --global --add safe.directory '*'

      # Aborts the run if any string it rewrites has moved upstream, and sweeps
      # the result for surviving marks. A tag bump that breaks branding fails
      # here rather than shipping a Nextcloud-branded package.
      - name: Apply Gantara branding
        run: bash platform/clients/desktop/branding/apply-branding.sh "${GITHUB_WORKSPACE}/desktop"

      # Upstream's script, upstream's arguments. The names and the icon path it
      # needs are already patched into it, so the only thing worth stating here
      # is the updater: no appcast is hosted, so it is compiled out.
      - name: Configure, compile and package
        id: build
        working-directory: desktop
        run: |
          BUILD_UPDATER=OFF \
          DESKTOP_CLIENT_ROOT="$(pwd)" \
          QT_BASE_DIR=/root/linux-gcc-x86_64 \
            /bin/bash -c "./admin/linux/build-appimage.sh"

      # apply-branding.sh installs them into share/<executable>/licenses, which
      # build-appimage.sh moves into the AppDir. Fail if a tag stops doing that.
      - name: Check the licences are in the AppImage
        run: |
          set -euo pipefail
          for f in COPYING THIRD-PARTY-NOTICES.md LICENSES/LGPL-3.0-or-later.txt LICENSES/Apache-2.0.txt; do
            ls /app/AppDir/usr/share/*/licenses/"${f}"
          done

      # The script names its output <executable>-master-<sha>-x86_64.AppImage,
      # after the commit of whatever repo the run belongs to — this one, not the
      # client's. Rename it after the client version actually built.
      - name: Name the AppImage after the client version
        id: package
        env:
          BUILT: ${{ steps.build.outputs.APPIMAGE_NAME }}
          DESKTOP_REF: ${{ github.event.inputs.desktop_ref }}
        run: |
          set -euo pipefail
          cd desktop
          name="Gantara_Desktop-${DESKTOP_REF#v}-x86_64.AppImage"
          mv -f "${BUILT}" "${name}"
          echo "name=${name}" >>"${GITHUB_OUTPUT}"
          ls -l "${name}"

      - name: Attach the AppImage to a GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: desktop-${{ github.event.inputs.desktop_ref }}
          name: Gantara Desktop ${{ github.event.inputs.desktop_ref }}
          body: |
            Gantara-branded build of the Nextcloud desktop sync client
            ${{ github.event.inputs.desktop_ref }}.

            Linux: install with `clients/install-appimage.sh`.
            Windows: NSIS setup; `Gantara_Desktop-*-signing.json` says whether
            it is Authenticode-signed (see SIGNING.md).
            The client does not check for updates; a new version means a new
            build here.
          files: desktop/${{ steps.package.outputs.name }}
          fail_on_unmatched_files: true
          make_latest: false

      - name: Keep the AppImage as a workflow artifact (test build)
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux
          path: desktop/${{ steps.package.outputs.name }}
          retention-days: 1

  windows:
    name: Rebrand and build Windows installer
    if: github.event.inputs.platform == 'windows'
    runs-on: windows-2022
    permissions:
      contents: write # publishes the GitHub release
      id-token: write # azure/login with OIDC, only when signing is configured
    timeout-minutes: 360
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - name: Check out this repo (branding overlay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: platform

      - name: Check the signing configuration
        id: signing
        shell: bash
        run: bash platform/.github/scripts/windows-signing-gate.sh

      - name: Check out nextcloud/desktop at the pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/desktop
          ref: ${{ github.event.inputs.desktop_ref }}
          submodules: recursive
          path: desktop

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Icon SVG → PNG rasterisation during the cmake/craft build.
      - name: Install Inkscape
        shell: pwsh
        run: choco install inkscape --yes --no-progress

      # Git Bash is on windows-2022; apply-branding.sh is POSIX bash.
      - name: Apply Gantara branding
        shell: bash
        run: bash platform/clients/desktop/branding/apply-branding.sh "${GITHUB_WORKSPACE}/desktop"

      # KDE Craft: install deps from Nextcloud's binary cache, compile the branded tree.
      - name: Build Windows (Craft)
        shell: pwsh
        env:
          BLUEPRINT_BRANCH: ${{ github.event.inputs.craft_blueprint_branch }}
          DESKTOP_REF: ${{ github.event.inputs.desktop_ref }}
        run: |
          & "$env:GITHUB_WORKSPACE\platform\clients\desktop\branding\build-windows.ps1" `
            -DesktopSrc "$env:GITHUB_WORKSPACE\desktop" `
            -Workspace "$env:GITHUB_WORKSPACE" `
            -BlueprintBranch "$env:BLUEPRINT_BRANCH" `
            -DesktopRef "$env:DESKTOP_REF" `
            -Stage build

      - name: Install the Artifact Signing tools
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\platform\clients\windows-signing.ps1" install'

      # After the hours-long build, so the session is fresh when Craft signs.
      - name: Log in to Azure (OIDC, no secret)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Package the NSIS installer. When signing, Craft signs every binary it collects
      # for the installer, then the installer; build-windows.ps1 then verifies the
      # installer and every .exe/.dll in its payload with signtool verify /pa.
      - name: Package Windows (Craft / NSIS)
        shell: pwsh
        env:
          BLUEPRINT_BRANCH: ${{ github.event.inputs.craft_blueprint_branch }}
          DESKTOP_REF: ${{ github.event.inputs.desktop_ref }}
        run: |
          & "$env:GITHUB_WORKSPACE\platform\clients\desktop\branding\build-windows.ps1" `
            -DesktopSrc "$env:GITHUB_WORKSPACE\desktop" `
            -Workspace "$env:GITHUB_WORKSPACE" `
            -BlueprintBranch "$env:BLUEPRINT_BRANCH" `
            -DesktopRef "$env:DESKTOP_REF" `
            -Stage package

      # Read by the gantara.eu download page and the release notes to decide whether to
      # show the SmartScreen hint; mirrored and checksummed with the installers.
      - name: Record the signing state
        shell: bash
        env:
          DESKTOP_REF: ${{ github.event.inputs.desktop_ref }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          printf '{"windows":{"authenticode":%s}}\n' "${SIGNED}" >"desktop-windows-out/Gantara_Desktop-${DESKTOP_REF#v}-signing.json"
          cat "desktop-windows-out/Gantara_Desktop-${DESKTOP_REF#v}-signing.json"

      - name: Attach installer to GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: desktop-${{ github.event.inputs.desktop_ref }}
          name: Gantara Desktop ${{ github.event.inputs.desktop_ref }}
          body: |
            Gantara-branded build of the Nextcloud desktop sync client
            ${{ github.event.inputs.desktop_ref }}.

            Linux: install with `clients/install-appimage.sh`.
            Windows: NSIS setup; `Gantara_Desktop-*-signing.json` says whether
            it is Authenticode-signed (see SIGNING.md).
            The client does not check for updates; a new version means a new
            build here.
          files: desktop-windows-out/*
          fail_on_unmatched_files: true
          make_latest: false

      - name: Keep the installer as a workflow artifact (test build)
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: desktop-windows-out/*
          retention-days: 1

  # Runs after whichever platform was built, so the release it attaches to exists.
  # The tarball only depends on the two commits, so a Linux and a Windows run from
  # the same commit upload identical bytes.
  source:
    name: Attach the source tarball
    needs: [appimage, windows]
    if: always() && inputs.release && (needs.appimage.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads to the release
    steps:
      - name: Check out this repo (branding overlay)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: platform

      - name: Check out nextcloud/desktop at the pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/desktop
          ref: ${{ github.event.inputs.desktop_ref }}
          path: desktop

      - name: Warn when upstream has a newer stable release
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_REF: ${{ github.event.inputs.desktop_ref }}
        run: |
          set -euo pipefail
          newest="$(gh api 'repos/nextcloud/desktop/releases?per_page=30' \
            -q '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sort -V | tail -n1)"
          if [ "$(printf '%s\n%s\n' "${newest}" "${DESKTOP_REF}" | sort -V | tail -n1)" != "${DESKTOP_REF}" ]; then
            echo "::warning::Built ${DESKTOP_REF}, but nextcloud/desktop has a newer stable release: ${newest}"
          else
            echo "${DESKTOP_REF} is the newest stable nextcloud/desktop release"
          fi

      - name: Build the source tarball
        id: tarball
        env:
          DESKTOP_REF: ${{ github.event.inputs.desktop_ref }}
        run: bash platform/clients/make-source-tarball.sh desktop desktop "${DESKTOP_REF}" platform out

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-${{ github.event.inputs.desktop_ref }}
          FILE: ${{ steps.tarball.outputs.file }}
        run: gh release upload "${TAG}" "${FILE}" --clobber -R "${GITHUB_REPOSITORY}"
