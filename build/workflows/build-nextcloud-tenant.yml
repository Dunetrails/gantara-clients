name: "Build: Nextcloud tenant image"

# Builds the immutable, apps-baked Nextcloud image used by stateless multi-replica tenants
# (docs/ha-nextcloud-stateless.md) and pushes it to GHCR. The plan's apps are baked into
# custom_apps at build time (images/nextcloud-tenant/), so runtime pods need no app install and
# no shared app PVC.
#
# Manual trigger: pick the base Nextcloud tag, the app set and a NEW image_tag, then set the
# resulting tag in the tenant's customer file (stateless.image) and run a sync. The Nextcloud
# version is derived from the image at runtime, so there is no separate version field to update.

on:
  workflow_dispatch:
    inputs:
      nextcloud_tag:
        description: "Base nextcloud image tag. Use the -apache variant for webServer=apache tenants (default) or the -fpm variant for webServer=fpm tenants (docs/ha-nextcloud-fpm.md). The flavor of stateless.image MUST match the tenant's stateless.webServer."
        required: true
        default: "35.0.2-fpm"
      apps:
        description: "Space-separated NON-shipped app ids to bake (do NOT add shipped apps like twofactor_totp or circles/Teams). On NC35 every app below resolves straight from the appstore, so no pinned-url (id@url) entries are needed — theming_customcss finally has an NC35 release (1.22.0, was pinned to the 1.20.0 tarball because nothing above NC33 existed). Its --force in the ApplicationSet's starter provisionEnforce is now redundant and can be dropped. tasks (0.18.1, min 31 / max 35) is enabled by the team and enterprise plans, so it must stay baked. groupfolders (upstream name 'Team Folders', 23.0.1 on NC35) backs the Gantara Hub shared workspace — see docs/identity-and-billing.md. Personal and Family do NOT use it (they are plain per-user quota), but it is inert until a Team Folder is actually created, so baking it everywhere is harmless."
        required: true
        default: "calendar contacts notes deck forms polls collectives notify_push onlyoffice user_oidc spreed mail previewgenerator theming_customcss groupfolders integration_google integration_onedrive tasks"
      image_tag:
        description: "NEW tag to publish (e.g. 35.0.2-all-fpm-2). No default. Bump the suffix for a rebuild so the new digest gets a NEW tag (a moved tag won't reliably re-pull / re-sync). Keep 'apache'/'fpm' in the tag to match the base you built from. Refused if any clusters/prod/apps/customers/*.yaml references it, or if it already exists in GHCR (unless overwrite)."
        required: true
      overwrite:
        description: "Allow replacing a tag that already exists in GHCR but no customer file references. Never bypasses the in-use check: a tag in stateless.image is always refused."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dunetrails/nextcloud-tenant

jobs:
  build:
    name: Build, push and scan (Trivy, SBOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tenant's image tag also names its migrate Job, so replacing an in-use tag neither re-runs
      # the migration nor reliably re-pulls: the pods would end up on whichever digest they cached.
      - name: Refuse an invalid or in-use image_tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::image_tag is empty or not a valid image tag"
            exit 1
          fi
          in_use=0
          for f in clusters/prod/apps/customers/*.yaml; do
            if yq '.stateless.image // ""' "$f" | sed 's/@.*//' | grep -Fxq "$IMAGE:$IMAGE_TAG"; then
              echo "::error file=$f::$IMAGE:$IMAGE_TAG is in use by this tenant; bump the tag suffix"
              in_use=1
            fi
          done
          exit "$in_use"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails closed: anything other than a clean "not found" (auth, network) stops the build.
      - name: Refuse to overwrite an existing GHCR tag
        if: ${{ !inputs.overwrite }}
        env:
          REF: ${{ env.IMAGE }}:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if out="$(docker buildx imagetools inspect "$REF" 2>&1)"; then
            echo "::error::$REF already exists in GHCR; bump the tag suffix, or re-run with overwrite if replacing it is intended"
            exit 1
          fi
          if ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
            echo "$out"
            echo "::error::could not determine whether $REF exists in GHCR"
            exit 1
          fi

      # OVH MKS nodes (b3/c3 flavors) are x86_64, so amd64 only — keeps the build fast (the app downloads
      # run under no emulation). Add linux/arm64 here if the cluster ever gains arm nodes.
      - name: Build and push (amd64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/nextcloud-tenant
          file: images/nextcloud-tenant/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXTCLOUD_TAG=${{ github.event.inputs.nextcloud_tag }}
            APPS=${{ github.event.inputs.apps }}
          tags: ${{ env.IMAGE }}:${{ github.event.inputs.image_tag }}
          labels: |
            # GHCR links a package to a repo via this label, and the linked repo is what decides
            # whether a repo's GITHUB_TOKEN may push. It pointed at the pre-fork k8s-platform repo,
            # so pushes from here were denied (permission_denied: write_package).
            org.opencontainers.image.source=https://github.com/Dunetrails/k8s-platform-ovh
            org.opencontainers.image.description=Immutable Nextcloud image with plan apps baked in (stateless tenants)
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # Vulnerability scan and SBOM of the pushed digest (docs/security-scanning.md). Report only:
      # findings land in the job summary and as warnings; the full report and the CycloneDX SBOM
      # are kept as an artifact.
      - name: Install trivy
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" trivy

      - name: Scan image and write SBOM (report only)
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          TAG_REF: ${{ env.IMAGE }}:${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-image"
          "$RUNNER_TEMP/trivy" image --quiet --scanners vuln,secret --list-all-pkgs \
            --format json --output "$RUNNER_TEMP/trivy-image/report.json" "$DIGEST_REF"
          "$RUNNER_TEMP/trivy" convert --quiet --format cyclonedx \
            --output "$RUNNER_TEMP/trivy-image/sbom.cdx.json" "$RUNNER_TEMP/trivy-image/report.json"
          bash .github/scripts/trivy-image-report.sh "$RUNNER_TEMP/trivy-image/report.json" "$TAG_REF"

      - name: Upload trivy report and SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-nextcloud-tenant
          path: ${{ runner.temp }}/trivy-image/
          if-no-files-found: ignore
          retention-days: 90
